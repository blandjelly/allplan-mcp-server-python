name: Final candidate checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Full compatibility/release check (false for an ordinary package candidate)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      run_portable: ${{ steps.policy.outputs.run_portable }}
      full_matrix: ${{ steps.policy.outputs.full_matrix }}
      validation_mode: ${{ steps.policy.outputs.validation_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: policy
        name: Select final-candidate checks
        run: python utils/ci_policy.py
  portable:
    name: portable (${{ matrix.os }}, ${{ matrix.python }})
    needs: configuration
    if: needs.configuration.outputs.run_portable == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.19
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
  package:
    needs: [configuration, portable]
    if: needs.configuration.outputs.run_portable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --frozen
      - run: uv build
      - run: uv run --frozen python utils/build_windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  ci-required:
    # Keep the PR context stable; manual two-job runs must not override its gate.
    name: ${{ github.event_name == 'pull_request' && 'ci-required' || 'ci-manual' }}
    needs: [configuration, portable, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce required candidate validation
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python utils/ci_required.py
