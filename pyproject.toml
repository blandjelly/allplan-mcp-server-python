[project]
name = "allplan-mcp-server"
version = "0.35.0"
description = "FastMCP bridge for controlling an Allplan Python host."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.2.4",
]

[project.scripts]
allplan-mcp = "allplan_mcp.server:main"
allplan-mcp-diagnostics = "allplan_mcp.diagnostics:main"
allplan-mcp-repairs = "allplan_mcp.repair_diagnostics:main"
allplan-mcp-standards = "allplan_mcp.standard_diagnostics:main"
allplan-mcp-marks = "allplan_mcp.mark_diagnostics:main"
allplan-mcp-workflows = "allplan_mcp.workflow_diagnostics:main"
allplan-mcp-conflicts = "allplan_mcp.conflict_diagnostics:main"
allplan-mcp-recovery-test = "allplan_mcp.recovery_diagnostics:main"
allplan-mcp-selected-mark = "allplan_mcp.selected_mark_diagnostics:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/allplan_mcp"]

[tool.hatch.build.targets.sdist]
# Do not recursively redistribute historical evaluation archives (over 100 MiB).
only-include = ["src", "python_host", "windows", "utils", "tests", "docs", "profiles", ".github", "README.md", "pyproject.toml", "uv.lock", ".gitattributes"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"
